name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nuriva_dev
          POSTGRES_PASSWORD: nuriva_dev_local_only
          POSTGRES_DB: nuriva_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nuriva_dev" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://nuriva_dev:nuriva_dev_local_only@localhost:5432/nuriva_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check migrations are up to date with the schema
        run: |
          cd packages/db
          npx drizzle-kit generate --name ci_check
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "Schema changed without a migration. Run: pnpm db:generate"; exit 1
          fi
